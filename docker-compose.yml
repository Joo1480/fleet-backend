version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: fleet-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleet_monitor

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: fleet-backend

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fleet_monitor

    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend

    container_name: fleet-frontend

    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000

    depends_on:
      - backend

volumes:
  postgres_data: